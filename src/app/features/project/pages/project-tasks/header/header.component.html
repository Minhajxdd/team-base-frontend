<div class="header">
    <h1>Project Tasks</h1>

  @if (role !== 'developer') {
    <button 
    (click)="onFormOpen()"
    class="add-task-btn">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Add Task
    </button>
  }

  </div>

  <app-add-task-form [isVisible]="isFormVisible()" (closeForm)="onFormClose($event)"></app-add-task-form>
