    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-black p-6 rounded-lg shadow-xl max-w-md w-full">
            <h2 class="text-white font-bold mb-4">Add Sub task</h2>
           <input 
           [(ngModel)]="value"
                type="text" 
                class="text-white w-full px-3 py-2 border rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Type something..."
            >
            <div class="flex justify-end space-x-2">
                <button 
                (click)="onClose()"
                    id="cancelBtn" 
                    class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300"
                >
                    Close
                </button>
                <button 
                (click)="submit()"
                
                    id="okBtn" 
                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                >
                    Add
                </button>
            </div>
        </div>
    </div>
