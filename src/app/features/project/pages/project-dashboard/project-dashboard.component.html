<div class="main-container">

    <div class="container-box">
        <div class="p-4">
            <header class="bg-[var(--bg-secondary)] rounded-lg p-6 mb-6 shadow-md">
                <div class="container mx-auto flex flex-col justify-center items-center">
                  <h2 class="mb-2 text-3xl font-extrabold text-[var(--text-primary)] md:text-[1.6rem]"><span class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400">Project</span> Dashboard</h2>
                </div>
            </header>

            <app-tasks-count-box></app-tasks-count-box>

            
    
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <div class="bg-[var(--bg-secondary)] p-4 rounded-lg">
                    <h2 class="text-xl font-bold mb-6">Latest Tasks</h2>
                    
                    
                    <app-latest-tasks-box></app-latest-tasks-box>

                </div>
    
                <div class="space-y-6">
                    
                    <app-quick-actions-box></app-quick-actions-box>
    
                    <div class="bg-[var(--bg-secondary)] p-4 rounded-lg">
                        <h2 class="text-xl font-bold mb-4">Quick Notes</h2>
                        
                        <div class="mb-4 space-y-3">
                            <div class="bg-gray-700 p-3 rounded-lg">
                                <p class="text-sm">Team meeting scheduled for tomorrow at 10 AM</p>
                                <p class="text-xs text-gray-400 mt-1">Added 2 hours ago</p>
                            </div>
                            <div class="bg-gray-700 p-3 rounded-lg">
                                <p class="text-sm">Review API documentation before integration</p>
                                <p class="text-xs text-gray-400 mt-1">Added yesterday</p>
                            </div>
                        </div>
    

                        <div class="space-y-3">
                            <textarea 
                                class="w-full h-24 bg-gray-700 rounded-lg p-3 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                placeholder="Add a new note..."
                            ></textarea>
                            <button class="bg-indigo-600 px-4 py-2 rounded-lg hover:bg-indigo-700 w-full">
                                Add Note
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>


</div>
