<div class="bg-[var(--bg-secondary)] p-4 rounded-lg shadow-md mt-5">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold text-[var(--text-primary)]">Notes</h2>
    </div>
  
    <div class="mb-4 space-y-3">

      @if (notes && notes.length > 0) {
        @for (note of notes; track note._id) {
  
          <div class="bg-[var(--secondary-next)] p-3 rounded-lg border-l-2 border-indigo-500 hover:bg-[var(--bg-primary)] transition-colors duration-200">
            <p class="text-sm text-[var(--text-primary)]">{{ note.title }}</p>
            <div class="flex justify-between items-center mt-1">
              <p class="text-xs text-[var(--accent-color)]">{{ note.description}}</p>
             
            </div>
          </div>
        }

      } @else { 
        <div class="bg-[var(--secondary-next)] p-4 rounded-lg border border-[#273c5a] text-center shadow-md">
          <p class="text-[var(--text-primary)]">No Notes!</p>
        </div>
      }

    </div>
  
    <div class="space-y-3">
      <button
      [routerLink]="['/project', projectId, 'notes']"
        class="bg-indigo-600 px-4 py-2 rounded-lg hover:bg-indigo-700 w-full text-gray-100 font-medium flex items-center justify-center transition-colors duration-200"
      >
        Open Notes
      </button>
    </div>
  </div>
