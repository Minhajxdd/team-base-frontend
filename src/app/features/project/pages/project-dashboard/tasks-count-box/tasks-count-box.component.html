@if (isLoading) {

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-[var(--bg-secondary)] p-5 rounded-lg shadow-md border-l-4 border-blue-500">
          <h3 class="text-[var(--text-primary)] font-medium mb-2">To Do</h3>
          <div class="h-8 w-16 bg-gray-700 rounded-md animate-pulse"></div>
        </div>
        
        <div class="bg-[var(--bg-secondary)] p-5 rounded-lg shadow-md border-l-4 border-yellow-500">
          <h3 class="text-[var(--text-primary)] font-medium mb-2">In Progress</h3>
          <div class="h-8 w-16 bg-gray-700 rounded-md animate-pulse"></div>
        </div>
        
        <div class="bg-[var(--bg-secondary)] p-5 rounded-lg shadow-md border-l-4 border-green-500">
          <h3 class="text-[var(--text-primary)] font-medium mb-2">Completed</h3>
          <div class="h-8 w-16 bg-gray-700 rounded-md animate-pulse"></div>
        </div>
      </div>

} @else {

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-[var(--bg-secondary)] p-5 rounded-lg shadow-md border-l-4 border-blue-500">
          <h3 class="text-[var(--text-primary)] font-medium mb-2">To Do</h3>
          <p class="text-3xl font-bold text-[var(--text-primary)]">{{ todo }}</p>
        </div>
        
        <div class="bg-[var(--bg-secondary)] p-5 rounded-lg shadow-md border-l-4 border-yellow-500">
          <h3 class="text-[var(--text-primary)] font-medium mb-2">In Progress</h3>
          <p class="text-3xl font-bold text-[var(--text-primary)]">{{ progress }}</p>
        </div>
        
        <div class="bg-[var(--bg-secondary)] p-5 rounded-lg shadow-md border-l-4 border-green-500">
          <h3 class="text-[var(--text-primary)] font-medium mb-2">Completed</h3>
          <p class="text-3xl font-bold text-[var(--text-primary)]">{{ done }}</p>
        </div>
      </div>
      
}
