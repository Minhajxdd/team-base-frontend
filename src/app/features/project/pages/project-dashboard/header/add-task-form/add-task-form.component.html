@if (isVisible()) {

<div class="modal" id="taskModal" style="display: block">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Add New Task</h2>
    </div>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="taskTitle" formControlName="title" required />
        <div
          *ngIf="
            taskForm.get('title')?.invalid && taskForm.get('title')?.touched
          "
        >
          <small *ngIf="taskForm.get('title')?.errors?.['required']"
            >Title is required.</small
          >
          <small *ngIf="taskForm.get('title')?.errors?.['pattern']">
            Title cannot be empty or contain only spaces.
          </small>
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="taskDescription" formControlName="description"></textarea>
        <div
          *ngIf="
            taskForm.get('description')?.invalid &&
            taskForm.get('description')?.touched
          "
        >
          <small *ngIf="taskForm.get('description')?.errors?.['pattern']">
            Description must contain only letters and spaces.
          </small>
        </div>
      </div>
      <div class="form-group">
        <label>Assigned To:</label>
        <select formControlName="assignedTo">
          @for (member of Members; track member.userId._id) {
          <option [value]="member.userId._id">
            {{ member.userId.full_name }}
          </option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select formControlName="priority">
          <option value="1">High</option>
          <option value="2">Medium</option>
          <option value="3">Low</option>
        </select>
      </div>
      <div class="form-group">
        <label>Dead Line</label>
        <input type="date" formControlName="deadline" required />
        <div
          *ngIf="
            taskForm.get('deadline')?.invalid &&
            taskForm.get('deadline')?.touched
          "
        >
          <small *ngIf="taskForm.get('deadline')?.errors?.['required']"
            >Deadline is required.</small
          >
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="oncloseForm()">
          Cancel
        </button>
        <button type="submit" class="save-btn" [disabled]="taskForm.invalid">
          Save Task
        </button>
      </div>
    </form>
  </div>
</div>

}
