<div
  id="modal"
  class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
>
  <!-- Added max-h-screen and overflow-y-auto to handle height issues -->
  <div class="bg-black p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-md max-h-screen overflow-y-auto">
    <h2 class="text-white text-xl font-bold mb-4">Confirm Video Call</h2>
    <p class="text-white">
      Are you sure you want to start the video call?
    </p>
    <div class="flex justify-end space-x-2 mt-6">
      <button
        (click)="onClose()"
        id="cancelBtn"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300"
      >
        NO
      </button>
      <button
        id="okBtn"
        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
      >
        YES
      </button>
    </div>
  </div>
</div>
