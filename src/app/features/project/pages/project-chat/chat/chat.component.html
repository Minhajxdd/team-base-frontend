<!-- Chat -->
<div
class="flex flex-col h-[calc(100vh-18vh)] max-h-[calc(100vh-18vh)] overflow-hidden">
  <!-- Messages area -->
  <div class="flex-grow overflow-hidden relative">
    <!-- Messages will be added here -->
    <div #scrollableDiv class="absolute inset-0 overflow-y-auto p-4 space-y-4">
      @for (message of messages; track message.time) { 
        @if (message.senderId === user.id) {
          <app-user-chat
            [chat]="message"
            [profile]="user.profile"
            [role]="role"
          ></app-user-chat>
        } @else {
          <app-receiving-chat
            [chat]="message"
            [member]="getProjectMemberById(message.senderId)"
          ></app-receiving-chat>
        } 
      }
      <div style="width: 10px; height: 200px;"></div>
    </div>
  
    <!-- Input Field (Fixed to Bottom) -->
    <div class="absolute bottom-0 left-0 w-full">
      <app-input (message)="onSendMessage($event)"></app-input>
    </div>
  </div>
  
</div>
