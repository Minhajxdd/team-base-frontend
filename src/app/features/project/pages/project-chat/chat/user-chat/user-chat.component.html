<div class="flex items-start justify-end mt-4">
  <div class="mr-3">
    <div class="flex items-center justify-end">
      <span class="text-xs text-gray-500 mx-2">{{ chat().time }}</span>
      <span class="text-[color:var(--text-primary)] text-sm font-medium"
        >You</span
      >
      <span class="ml-2 text-xs text-blue-400">[{{role()}}]</span>
    </div>
    <div class="mt-1 max-w-xs sm:max-w-md bg-blue-600 rounded-lg p-3">
      <p class="text-white">
        {{chat().text}}
      </p>
    </div>
  </div>
  <div class="flex-shrink-0">
    @if (profile()) {
        <img
          class="w-8 h-8 rounded-full bg-gray-700"
          [src]="profile()"
          alt=""
        />
        } @else {
        <div
          class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-700"
        >
          <i class="text-[1.6rem] text-white bx bx-user"></i>
        </div>
        }
  </div>
</div>
