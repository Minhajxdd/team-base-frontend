

<div [ngClass]="{'hidden': !show()}" class="hidden slide-in bg-gray-200 rounded-lg shadow-lg p-6 max-w-sm w-full mx-auto transform transition-all duration-300 hover:shadow-xl">
    <div class="flex items-center space-x-4">
      <div class="flex-shrink-0">
        <div class="h-12 w-12 rounded-full bg-blue-500 flex items-center justify-center">
          <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-4l-4 4z"/>
          </svg>
        </div>
      </div>
      <div class="flex-1">
        <h3 class="text-lg font-medium text-gray-900">Are you sure you want to delete this message</h3>
        
  
    </div>
    </div>
    <div class="mt-4 flex justify-end space-x-3">
      <button
      (click)="onClose()"
      class="px-4 py-2 bg-white text-gray-700 rounded-md hover:bg-gray-300 transition-colors duration-200">
        NO
      </button>
      <button 
      (click)="onSubmit()"
      type="submit"
      class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors duration-200">
        Yes
      </button>
    </div>
  </div>
