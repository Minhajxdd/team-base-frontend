<div class="flex h-[92vh] relative chat-container">
  <!-- Sidebar Toggle for Mobile -->
  <button
    id="sidebarToggle"
    class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-gray-800 rounded-md text-gray-300 hover:text-white"
  >
    <i class="fas fa-bars"></i>
  </button>

  <div
    id="sidebar"
    class="w-64 bg-[color:var(--second-navbar)] border-r border-[color:var(--text-primary)] flex-none transform -translate-x-full lg:translate-x-0 transition-transform duration-300 fixed lg:relative h-full z-40"
  >
    <div class="flex flex-col h-full">
      <!-- User Profile -->
      <app-chat-user-profile></app-chat-user-profile>

      <!-- Members List -->
     
      <app-members [projectId]="projectId"></app-members>


    </div>
  </div>

  <div class="flex-1 flex flex-col">
    
    <div
      class="bg-[color:var(--second-navbar)] border-b border-[color:var(--text-primary)] p-3.5"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <div
            class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center"
          >
            <i class="fas fa-code text-blue-400"></i>
          </div>
          <div class="ml-3">
            <div class="flex items-center">
              <h3 class="font-medium text-[color:var(--text-primary)]">
                Frontend Team
              </h3>
            </div>
            <p class="text-sm text-[color:var(--accent-color)]">5 members</p>
          </div>
        </div>
        <div class="flex space-x-4">
          <button
            class="p-2 hover:bg-gray-700 rounded-full text-gray-300 hover:text-white"
          >
            <i class="fas fa-phone"></i>
          </button>
          <button
            class="p-2 hover:bg-gray-700 rounded-full text-gray-300 hover:text-white"
          >
            <i class="fas fa-video"></i>
          </button>
        </div>
      </div>
    </div>

    <app-chat class="h-full w-full"></app-chat>

    
  </div>
</div>
