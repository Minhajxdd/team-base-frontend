<main class="container mx-auto mt-10 px-6 fade-in">
  <section
    class="bg-[color:var(--bg-secondary)] shadow-lg rounded-lg p-8 max-w-3xl mx-auto"
  >
    <h2 class="text-3xl font-bold text-[color:var(--accent-color)] mb-6">
      Update Your Details
    </h2>


    <app-profile-image-card [imageUrl]="user()?.profile"></app-profile-image-card>

    <form id="profileForm" class="space-y-6">

      <div>
        <label for="name" class="block text-sm font-medium text-[#EEEEEE]"
          >Name</label
        >
        <input
          type="text"
          id="name"
          [value]="user()?.fullName"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="Your name"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-[#EEEEEE]"
          >Email</label
        >
        <input
          type="email"
          [value]="user()?.email"
          id="email"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="Your email"
        />
      </div>

      <!-- Phone Number -->
      <div>
        <label for="phone" class="block text-sm font-medium text-[#EEEEEE]"
          >Phone Number</label
        >
        <input
          type="tel"
          id="phone"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="Your phone number"
        />
      </div>

      <!-- Password Reset -->
      <div>
        <label for="password" class="block text-sm font-medium text-[#EEEEEE]"
          >Password</label
        >
        <div class="relative">
          <input
            type="password"
            id="password"
            class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
            placeholder="••••••••"
            disabled
          />
          <button
            type="button"
            class="absolute top-0 right-0 mt-1 mr-1 bg-[#00ADB5] text-[#222831] px-3 py-1 rounded-md hover:bg-[#00ADB5]/80"
          >
            Reset Password
          </button>
        </div>
      </div>

      <!-- Education -->
      <div>
        <label for="education" class="block text-sm font-medium text-[#EEEEEE]"
          >Education</label
        >
        <input
          type="text"
          id="education"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="Your education"
        />
      </div>

      <!-- Hobbies -->
      <div>
        <label for="hobbies" class="block text-sm font-medium text-[#EEEEEE]"
          >Hobbies</label
        >
        <textarea
          id="hobbies"
          rows="3"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="Your hobbies"
        ></textarea>
      </div>

      <!-- Skills -->
      <div>
        <label
          for="skillsInput"
          class="block text-sm font-medium text-[#EEEEEE]"
          >Skills</label
        >
        <input
          type="text"
          id="skillsInput"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="Type a skill and press Enter"
        />
        <div id="skillsContainer" class="mt-2 flex flex-wrap"></div>
      </div>

      <!-- Social Media Links -->
      <div>
        <label
          for="socialMedia"
          class="block text-sm font-medium text-[#EEEEEE]"
          >Social Media Links</label
        >
        <input
          type="url"
          id="socialMedia"
          class="mt-1 block w-full px-4 py-2 border border-[#00ADB5] rounded-md bg-[#222831] text-[#EEEEEE] focus:ring-[#00ADB5] focus:border-[#00ADB5]"
          placeholder="https://yourprofile.com"
        />
      </div>

      <!-- Visibility Toggle -->
      <div class="flex items-center">
        <input
          id="visibility"
          type="checkbox"
          class="h-4 w-4 text-[#00ADB5] border-[#00ADB5] rounded focus:ring-[#00ADB5]"
        />
        <label for="visibility" class="ml-2 block text-sm text-[#EEEEEE]"
          >Make Profile Public</label
        >
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end">
        <button
          type="submit"
          class="px-6 py-2 bg-[#00ADB5] text-[#222831] rounded-md hover:bg-[#00ADB5]/80"
        >
          Save Changes
        </button>
      </div>
    </form>
  </section>
</main>
