<div id="container" class="flex items-center justify-center min-h-screen">
  <div class="floating-card max-w-md w-full p-1 rounded-2xl shadow-2xl">
    <div class="card-content rounded-2xl p-8">
      <!-- Animated Logo -->

      <div class="text-center mb-4">
        <h2
          class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent"
        >
          @if (isRegister) { Create a Account } @else { Log In }
        </h2>
      </div>

      <form [formGroup]="authForm" 
      (ngSubmit)="onSubmit()"
      class="space-y-6">
        @if (isRegister) {
        <div class="floating-input">
          <input
            formControlName="fullname"
            type="text"
            id="fullname"
            placeholder=" "
            class="text-gray-200"
          />
          <label for="fullname" class="text-gray-400">Full Name</label>
        </div>
        }

        <div class="floating-input">
          <input
          formControlName="email"
            type="email"
            id="email"
            placeholder=" "
            class="text-gray-200"
          />
          <label for="email" class="text-gray-400">Your Email</label>
        </div>

        <div class="floating-input">
          <input
          formControlName="password"
            type="password"
            id="password"
            placeholder=" "
            class="text-gray-200"
          />
          <label for="password" class="text-gray-400">Password</label>
        </div>

        @if (isRegister) {
        <div class="floating-input">
          <input
          formControlName="repassword"
            type="password"
            id="re-password"
            placeholder=" "
            class="text-gray-200"
          />
          <label for="re-password" class="text-gray-400"
            >Re-enter Password</label
          >
        </div>
        }

        <div class="floating-input">
          <span class="err-msg">{{ errMsg() }}</span>
        </div>

        <button
          type="submit"
          class="glowing relative w-full rounded-lg overflow-hidden group"
        >
          <div
            class="relative px-4 py-3 bg-gradient-to-r from-indigo-500 to-cyan-500 text-white font-medium group-hover:opacity-90 transition-all duration-300 transform group-hover:scale-105"
          >
          @if (isRegister) {
              Create Account
          } @else {
            Log In
          }
            <span
              class="absolute right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              >→</span
            >
          </div>
        </button>

        <button
        (click)="onGoogleClick()"
        type="button"
        class="relative w-full rounded-lg overflow-hidden group shadow-md"
      >
        <div
          class="relative px-4 py-3 bg-white text-gray-600 font-medium group-hover:bg-gray-50 transition-all duration-300 transform group-hover:scale-105 flex items-center justify-center"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24" height="24" class="mr-3">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
          </svg>
          Sign in with Google
          <span
            class="absolute right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
          >→</span>
        </div>
      </button>

          <button
          #googleButton
          style="display: none;"
          id="google-btn"
          type="button"
        >
        </button>

  


        
      </form>

      <!-- Already have account -->
      <div class="mt-8 text-center">
        <p class="text-gray-400">

            @if (isRegister) {
                Already have an account?
                <a
                  routerLink="/login"
                  class="text-indigo-400 hover:text-indigo-300 font-medium ml-1"
                  >Sign in</a
                >
            } @else {
                <div class='flex justify-center gap-3'>
                    <a
                      routerLink="/reset-password"
                      class="text-indigo-400 hover:text-indigo-300 font-medium ml-1"
                      >Forgot Password ?</a
                    >
                    <a
                      routerLink="/register"
                      class="text-indigo-400 hover:text-indigo-300 font-medium ml-1"
                      >Create Account</a
                    >

                </div>
            }

        </p>
      </div>
    </div>
  </div>
</div>
