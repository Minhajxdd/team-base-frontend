<div id="notification-container" class="fixed top-6 right-4 space-y-4">
  <div
    id="notification"
    class="notification-slide w-80 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-100 dark:border-gray-700 transform hover:scale-102 transition-transform duration-200 overflow-hidden"
  >
    <div class="p-4 flex items-start space-x-3">
      <div class="flex-shrink-0">
        <div
          class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg icon-pulse"
        >
          <svg
            class="w-7 h-7 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
            />
          </svg>
        </div>
      </div>

      <div class="flex-1">
        <div class="flex justify-between items-start">
          <div>
            <div class="flex items-center space-x-2">
              <h3 class="font-semibold text-gray-800 dark:text-gray-200">
                {{ notificationData()?.title }}
              </h3>
            </div>
            <p
              class="text-gray-600 dark:text-gray-400 text-sm mt-1 leading-relaxed"
            >
              {{ notificationData()?.description }}
            </p>
          </div>
          <button
            class="ml-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors duration-200"
          >
            <svg
            (click)="destoryComponent()"
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="progress-bar"></div>
  </div>
</div>
